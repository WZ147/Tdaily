<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tdaily · 日常系统</title>
  <meta name="description" content="Tdaily - 个人日常系统：待办、习惯、记录、日历、统计">
  <meta name="theme-color" content="#ef8171">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth" id="auth"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">T</span>
        <span class="brand-name">Tdaily</span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="side-date" id="side-date"></div>
        <div class="side-tip" id="side-user">数据保存在本机</div>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="tb-left">
          <h1 id="page-title">今日</h1>
          <span class="tb-date" id="page-sub"></span>
        </div>
        <div class="tb-right">
          <button class="icon-btn" id="theme-btn" data-act="theme:toggle" aria-label="切换主题"></button>
          <button class="btn primary" data-act="todo:new">
            <span class="btn-ic"></span><span class="btn-txt">新建待办</span>
          </button>
        </div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>

  <nav class="tabbar" id="tabbar"></nav>

  <div class="sheet-wrap" id="sheet-wrap">
    <div class="sheet" id="sheet"></div>
  </div>

  <div class="modal-wrap" id="modal-wrap">
    <div class="modal" id="modal"></div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="/js/app.js"></script>
</body>
</html>
